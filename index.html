<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ловец посылок</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(15, 15, 30, 0.92); color: #fff; padding: 20px; z-index: 10;
  }
  .overlay.hidden { display: none; }
  h1 { font-size: clamp(28px, 7vw, 52px); margin-bottom: 12px; color: #ffd93d; text-shadow: 0 3px 0 #b8860b; letter-spacing: 1px; }
  .subtitle { font-size: clamp(14px, 3.5vw, 20px); color: #a0a0c0; margin-bottom: 30px; max-width: 500px; line-height: 1.5; }
  .btn {
    padding: 16px 44px; font-size: clamp(16px, 4vw, 22px); font-weight: 700;
    background: linear-gradient(180deg, #ffd93d, #f0a500); color: #1a1a2e;
    border: none; border-radius: 50px; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 6px 0 #b8860b, 0 10px 20px rgba(0,0,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8860b, 0 4px 10px rgba(0,0,0,0.4); }
  .stats { display: flex; gap: 40px; margin-bottom: 30px; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat-val { font-size: clamp(32px, 8vw, 56px); font-weight: 800; color: #ffd93d; line-height: 1; }
  .stat-label { font-size: clamp(12px, 3vw, 16px); color: #a0a0c0; margin-top: 6px; text-transform: uppercase; letter-spacing: 2px; }
  #gameUI {
    position: fixed; top: 0; left: 0; right: 0; padding: 16px 20px;
    display: flex; justify-content: space-between; pointer-events: none; z-index: 5;
    font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  .ui-score { font-size: clamp(20px, 5vw, 32px); color: #ffd93d; }
  .ui-lives { font-size: clamp(20px, 5vw, 32px); color: #ff6b6b; letter-spacing: 4px; }
  .hint { margin-top: 24px; font-size: clamp(12px, 3vw, 15px); color: #666; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="gameUI" style="display:none">
  <div class="ui-score">Очки: <span id="scoreVal">0</span></div>
  <div class="ui-lives" id="livesVal">❤❤❤</div>
</div>

<div class="overlay" id="startScreen">
  <h1>📦 ЛОВЕЦ ПОСЫЛОК</h1>
  <p class="subtitle">Ловите падающие коробки и не дайте им разбиться!<br>Избегайте бомб 💣</p>
  <button class="btn" id="startBtn">ИГРАТЬ</button>
  <p class="hint">Управление: мышь / палец / стрелки ← →</p>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <h1 style="color:#ff6b6b">ИГРА ОКОНЧЕНА</h1>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="finalScore">0</div><div class="stat-label">Очки</div></div>
    <div class="stat"><div class="stat-val" id="bestScore">0</div><div class="stat-label">Рекорд</div></div>
  </div>
  <button class="btn" id="restartBtn">ЕЩЁ РАЗ</button>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const gameUI = document.getElementById('gameUI');
  const scoreVal = document.getElementById('scoreVal');
  const livesVal = document.getElementById('livesVal');
  const finalScore = document.getElementById('finalScore');
  const bestScore = document.getElementById('bestScore');

  let W, H, DPR;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // --- Игровое состояние ---
  const state = {
    running: false,
    score: 0,
    lives: 3,
    items: [],
    particles: [],
    player: { x: 0, y: 0, w: 120, h: 30, targetX: 0 },
    spawnTimer: 0,
    spawnInterval: 1200,
    lastTime: 0,
    elapsed: 0,
    keys: { left: false, right: false },
    stars: []
  };

  for (let i = 0; i < 60; i++) {
    state.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.6 + 0.4,
      a: Math.random() * 0.7 + 0.2,
      speed: Math.random() * 0.3 + 0.05
    });
  }

  function resetGame() {
    state.score = 0;
    state.lives = 3;
    state.items = [];
    state.particles = [];
    state.spawnTimer = 0;
    state.spawnInterval = 1200;
    state.elapsed = 0;
    state.player.w = Math.max(90, Math.min(140, W * 0.22));
    state.player.h = 26;
    state.player.x = W / 2 - state.player.w / 2;
    state.player.y = H - 90;
    state.player.targetX = state.player.x;
    scoreVal.textContent = '0';
    updateLivesUI();
  }

  function updateLivesUI() {
    livesVal.textContent = '❤'.repeat(Math.max(0, state.lives)) || '💔';
  }

  // --- Управление ---
  function setTarget(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    state.player.targetX = x - state.player.w / 2;
  }

  canvas.addEventListener('mousemove', e => { if (state.running) setTarget(e.clientX); });
  canvas.addEventListener('touchstart', e => { if (state.running) { e.preventDefault(); setTarget(e.touches[0].clientX); } }, { passive: false });
  canvas.addEventListener('touchmove', e => { if (state.running) { e.preventDefault(); setTarget(e.touches[0].clientX); } }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = true;
    if (e.key === ' ' && !state.running) {
      if (!startScreen.classList.contains('hidden')) startGame();
      else if (!gameOverScreen.classList.contains('hidden')) startGame();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = false;
  });

  // --- Спавн предметов ---
  function spawnItem() {
    const isBomb = Math.random() < Math.min(0.18 + state.elapsed / 60000, 0.4);
    const size = Math.max(38, Math.min(56, W * 0.1));
    state.items.push({
      x: Math.random() * (W - size - 40) + 20,
      y: -size,
      w: size,
      h: size,
      vy: 2.2 + Math.random() * 1.4 + state.elapsed / 30000,
      vx: (Math.random() - 0.5) * 1.4,
      rot: 0,
      rotSpeed: (Math.random() - 0.5) * 0.06,
      isBomb,
      caught: false
    });
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 4 + 1.5;
      state.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1,
        life: 1,
        color,
        size: Math.random() * 4 + 2
      });
    }
  }

  // --- Отрисовка ---
  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1a2e');
    grad.addColorStop(0.6, '#16213e');
    grad.addColorStop(1, '#0f3460');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Звёзды
    for (const s of state.stars) {
      s.y += s.speed;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Земля
    ctx.fillStyle = 'rgba(255, 217, 61, 0.08)';
    ctx.fillRect(0, H - 60, W, 60);
  }

  function drawPlayer() {
    const p = state.player;
    ctx.save();
    // Тень
    ctx.shadowColor = 'rgba(255, 217, 61, 0.6)';
    ctx.shadowBlur = 20;

    // Платформа
    const grad = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
    grad.addColorStop(0, '#ffe66d');
    grad.addColorStop(1, '#f0a500');
    ctx.fillStyle = grad;
    roundRect(p.x, p.y, p.w, p.h, 8);
    ctx.fill();

    ctx.shadowBlur = 0;
    // Полоска сверху
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    roundRect(p.x + 6, p.y + 4, p.w - 12, 5, 3);
    ctx.fill();
    ctx.restore();
  }

  function drawItem(item) {
    ctx.save();
    ctx.translate(item.x + item.w / 2, item.y + item.h / 2);
    ctx.rotate(item.rot);

    if (item.isBomb) {
      // Бомба
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath();
      ctx.arc(0, 4, item.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Блик
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(-item.w * 0.15, -item.w * 0.1, item.w * 0.12, 0, Math.PI * 2);
      ctx.fill();
      // Фитиль
      ctx.strokeStyle = '#8b4513';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -item.w / 2 + 4);
      ctx.quadraticCurveTo(8, -item.w / 2 - 8, 4, -item.w / 2 - 12);
      ctx.stroke();
      // Искра
      ctx.fillStyle = '#ff6b00';
      ctx.beginPath();
      ctx.arc(4, -item.w / 2 - 13, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd93d';
      ctx.beginPath();
      ctx.arc(4, -item.w / 2 - 13, 1.8, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Коробка
      ctx.fillStyle = '#c98a3c';
      ctx.fillRect(-item.w / 2, -item.h / 2, item.w, item.h);
      // Крышка
      ctx.fillStyle = '#a8722e';
      ctx.fillRect(-item.w / 2, -item.h / 2, item.w, item.h * 0.28);
      // Лента вертикальная
      ctx.fillStyle = '#ffd93d';
      ctx.fillRect(-item.w * 0.1, -item.h / 2, item.w * 0.2, item.h);
      // Лента горизонтальная
      ctx.fillRect(-item.w / 2, -item.h * 0.06, item.w, item.h * 0.12);
      // Обводка
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-item.w / 2, -item.h / 2, item.w, item.h);
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of state.particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // --- Обновление ---
  function update(dt) {
    const p = state.player;

    // Клавиатура
    const speed = 0.7 * dt;
    if (state.keys.left) p.targetX -= speed;
    if (state.keys.right) p.targetX += speed;

    // Плавное движение
    p.x += (p.targetX - p.x) * 0.25;
    p.x = Math.max(0, Math.min(W - p.w, p.x));
    p.targetX = Math.max(0, Math.min(W - p.w, p.targetX));

    // Спавн
    state.elapsed += dt;
    state.spawnTimer += dt;
    const interval = Math.max(400, 1200 - state.elapsed / 40);
    if (state.spawnTimer > interval) {
      state.spawnTimer = 0;
      spawnItem();
    }

    // Предметы
    for (let i = state.items.length - 1; i >= 0; i--) {
      const it = state.items[i];
      it.y += it.vy * dt / 16;
      it.x += it.vx * dt / 16;
      it.rot += it.rotSpeed * dt / 16;

      // Столкновение с платформой
      if (!it.caught &&
          it.y + it.h > p.y &&
          it.y < p.y + p.h &&
          it.x + it.w > p.x &&
          it.x < p.x + p.w) {
        it.caught = true;
        if (it.isBomb) {
          state.lives--;
          updateLivesUI();
          spawnParticles(it.x + it.w / 2, it.y + it.h / 2, '#ff4444', 20);
          if (state.lives <= 0) {
            endGame();
            return;
          }
        } else {
          state.score++;
          scoreVal.textContent = state.score;
          spawnParticles(it.x + it.w / 2, it.y + it.h / 2, '#ffd93d', 12);
        }
        state.items.splice(i, 1);
        continue;
      }

      // Упал вниз
      if (it.y > H + 20) {
        if (!it.isBomb && !it.caught) {
          state.lives--;
          updateLivesUI();
          spawnParticles(it.x + it.w / 2, H - 20, '#ff6b6b', 15);
          if (state.lives <= 0) {
            endGame();
            return;
          }
        }
        state.items.splice(i, 1);
      }
    }

    // Частицы
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.15;
      pt.life -= 0.025;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
  }

  function draw() {
    drawBackground();
    for (const it of state.items) drawItem(it);
    drawPlayer();
    drawParticles();
  }

  function loop(t) {
    if (!state.running) return;
    if (!state.lastTime) state.lastTime = t;
    let dt = t - state.lastTime;
    state.lastTime = t;
    if (dt > 50) dt = 50;
    update(dt);
    if (!state.running) return;
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    resetGame();
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    gameUI.style.display = 'flex';
    state.running = true;
    state.lastTime = 0;
    requestAnimationFrame(loop);
  }

  function endGame() {
    state.running = false;
    gameUI.style.display = 'none';
    finalScore.textContent = state.score;
    const best = Math.max(state.score, parseInt(localStorage.getItem('pkgBest') || '0'));
    localStorage.setItem('pkgBest', best);
    bestScore.textContent = best;
    gameOverScreen.classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // Фоновая анимация до старта
  function idleLoop() {
    if (state.running) return;
    drawBackground();
    requestAnimationFrame(idleLoop);
  }
  idleLoop();
})();
</script>
</body>
</html>
